name: SupportFlow AI background workers
on:
  # Production scheduling is owned by Supabase pg_cron (database/supportflow_scheduler.sql).
  # Keep this workflow as an explicitly configured manual fallback only.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supportflow-production-workers
  cancel-in-progress: false

jobs:
  process:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: production
    env:
      SUPPORTFLOW_WORKER_BASE_URL: ${{ vars.SUPPORTFLOW_WORKER_BASE_URL }}
      SUPPORTFLOW_WORKER_CRON_SECRET: ${{ secrets.SUPPORTFLOW_WORKER_CRON_SECRET }}
    steps:
      - name: Validate worker configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPPORTFLOW_WORKER_BASE_URL:-}" || { echo 'Missing production worker base URL'; exit 1; }
          test "${#SUPPORTFLOW_WORKER_CRON_SECRET}" -ge 24 || { echo 'Missing worker secret'; exit 1; }
          case "$SUPPORTFLOW_WORKER_BASE_URL" in https://*) ;; *) echo 'Worker URL must use HTTPS'; exit 1 ;; esac
      - name: Process AI jobs
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 5 --max-time 90 \
            -H "Authorization: Bearer $SUPPORTFLOW_WORKER_CRON_SECRET" \
            "$SUPPORTFLOW_WORKER_BASE_URL/api/internal/process-ai-jobs"
      - name: Deliver Telegram outbox
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 5 --max-time 90 \
            -H "Authorization: Bearer $SUPPORTFLOW_WORKER_CRON_SECRET" \
            "$SUPPORTFLOW_WORKER_BASE_URL/api/internal/deliver-support-outbox"
